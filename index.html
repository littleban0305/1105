<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <title>生日驚喜</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a3a;
      --navy: #102943;
      --navy-light: #244665;
      --gold: #c39a50;
      --paper: #f5f0e6;
      --muted: #66716f;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(245, 240, 230, .22), rgba(245, 240, 230, .22)), url("assets/background.png?v=20261023");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(26px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
    }

    .container {
      width: min(100%, 560px);
      margin-inline: auto;
    }

    .row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .col-12 { width: 100%; }
    .text-center { text-align: center; }
    .text-dark { color: var(--ink); }
    .my-5 { margin-block: 18px; }
    .mt-5 { margin-top: 16px; }
    .d-flex { display: flex; }
    .justify-content-center { justify-content: center; }

    .eyebrow {
      margin: 0 0 10px;
      color: #8d6d37;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 500;
      line-height: 1.08;
    }

    .intro {
      max-width: 30ch;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .box {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 1000 / 700;
    }

    .box-body {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 1000 / 700;
      border-radius: 4px;
      touch-action: none;
    }

    .gift {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .open-surface {
      position: absolute;
      z-index: 2;
      top: 14%;
      left: 2%;
      width: 96%;
      height: 27%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: none;
    }

    .open-surface:focus-visible {
      outline: 2px solid #9b7435;
      outline-offset: 4px;
    }

    .hover-prompt {
      margin: 0;
      color: #8d6d37;
      font-size: 12px;
      font-weight: 650;
    }

    .actions {
      min-height: 52px;
      margin-top: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .action-button {
      min-height: 46px;
      padding: 0 23px;
      border: 1px solid #173449;
      border-radius: 3px;
      color: #fffaf0;
      background: var(--navy);
      box-shadow: 0 4px 0 #c6a15e;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      touch-action: none;
      transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .action-button:hover { background: var(--navy-light); }
    .action-button:active { box-shadow: 0 1px 0 #c6a15e; transform: translateY(3px); }
    .action-button:focus-visible { outline: 3px solid #b88b3c; outline-offset: 4px; }
    .action-button[hidden] { display: none; }
    .action-button:disabled { cursor: default; opacity: .7; }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: #5f6965;
      font-size: 13px;
      line-height: 1.5;
    }

    .experience {
      width: min(100%, 560px);
      text-align: center;
      position: relative;
    }

    .gift-progress {
      --progress-position: 50%;
      position: relative;
      width: min(100%, 360px);
      height: 64px;
      margin: 12px auto 0;
      touch-action: none;
      user-select: none;
    }

    .gift-progress__hint {
      min-height: 20px;
      margin: 0;
      color: #8d6d37;
      font-size: 13px;
      font-weight: 700;
      line-height: 20px;
    }

    .gift-progress__track {
      position: absolute;
      top: 50%;
      right: 30px;
      left: 30px;
      height: 14px;
      border: 1px solid #a77e38;
      border-radius: 999px;
      background: linear-gradient(90deg, #b78b42, #e1c276 48%, #bb9048);
      box-shadow: inset 0 1px 2px #071b2b44, 0 2px 3px #071b2b18;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .gift-progress__thumb {
      position: absolute;
      top: 50%;
      left: var(--progress-position);
      z-index: 1;
      display: grid;
      width: 60px;
      height: 60px;
      padding: 0;
      place-items: center;
      border: 2px solid #c39a50;
      border-radius: 50%;
      color: var(--navy);
      background: #fffdf7;
      box-shadow: 0 3px 8px #071b2b30, inset 0 1px 2px #fff;
      cursor: grab;
      touch-action: none;
      transform: translate(-50%, -50%);
      transition: left 180ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .gift-progress__thumb:active { cursor: grabbing; }
    .gift-progress__thumb:disabled { cursor: default; opacity: .75; }
    .gift-progress__thumb:focus-visible { outline: 3px solid #9b7435; outline-offset: 4px; }
    .gift-progress__thumb svg { width: 28px; height: 28px; fill: currentColor; }
    .gift-progress__thumb svg { pointer-events: none; }
    .gift-progress__thumb.is-pressed { transition: none; }

    @media (max-height: 680px) {
      main {
        padding-top: 18px;
        padding-bottom: 16px;
      }
      h1 { font-size: 32px; }
      .intro { margin-top: 7px; }
      .box { width: min(88vw, 360px, calc(100svh - 64px)); }
      .status { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

    .gift canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    .gift canvas:active { cursor: grabbing; }

    .gift-box-container {
      aspect-ratio: 1;
      perspective: 900px;
      perspective-origin: 50% 48%;
      transform: translate3d(0, var(--fall-y, 0px), 0);
      will-change: transform;
    }

    .gift-box {
      --box-width: min(68vw, 280px);
      --box-width-half: min(34vw, 140px);
      --box-depth: min(50vw, 206px);
      --box-depth-half: min(25vw, 103px);
      --box-height: min(48vw, 198px);
      --box-height-half: min(24vw, 99px);
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      transform: scale(var(--gift-scale, .75)) rotateX(var(--gift-rotate-x, -17deg)) rotateY(var(--gift-rotate-y, -31deg));
      transform-style: preserve-3d;
      touch-action: none;
      transition: transform 360ms cubic-bezier(.2,.72,.25,1);
    }

    .gift-box-container.is-rotating .gift-box { transition: none; }

    @media (hover: hover) and (pointer: fine) {
      .gift-box-container:not(.is-bow-dropping):not(.is-bow-dropped):not(.is-tearing):not(.is-opening):not(.is-opened):hover .gift-box {
        transform: scale(var(--gift-scale, .75)) translateY(-5px) rotateX(var(--gift-rotate-x, -17deg)) rotateY(var(--gift-rotate-y, -31deg));
      }
    }

    .gift-box__body,
    .gift-box__wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--box-width);
      height: var(--box-height);
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
    }

    .gift-box__wrap { z-index: 2; }

    .gift-box__side,
    .gift-box__end,
    .gift-box-lid__side,
    .gift-box-lid__end {
      position: absolute;
      top: 50%;
      left: 50%;
      box-sizing: border-box;
      border: 1px solid #071b2b;
      backface-visibility: hidden;
    }

    .gift-box__side,
    .gift-box-lid__side,
    .gift-box__end,
    .gift-box-lid__end {
      background-color: #102943;
      background-image: linear-gradient(90deg, transparent 42%, #c39a50 42% 58%, transparent 58%), linear-gradient(0deg, transparent 42%, #c39a50 42% 58%, transparent 58%), linear-gradient(145deg, #244665, #102943 75%);
    }

    .gift-box__side--front,
    .gift-box__side--back {
      width: var(--box-width);
      height: var(--box-height);
    }

    .gift-box__side--front { transform: translate(-50%, -50%) translateZ(var(--box-depth-half)); }
    .gift-box__side--back { transform: translate(-50%, -50%) rotateY(180deg) translateZ(var(--box-depth-half)); }

    .gift-box__side--left,
    .gift-box__side--right {
      width: var(--box-depth);
      height: var(--box-height);
    }

    .gift-box__side--left { transform: translate(-50%, -50%) rotateY(-90deg) translateZ(var(--box-width-half)); }
    .gift-box__side--right { transform: translate(-50%, -50%) rotateY(90deg) translateZ(var(--box-width-half)); }

    .gift-box__end {
      width: var(--box-width);
      height: var(--box-depth);
    }

    .gift-box__end--top { transform: translate(-50%, -50%) rotateX(90deg) translateZ(var(--box-height-half)); }
    .gift-box__end--bottom { transform: translate(-50%, -50%) rotateX(-90deg) translateZ(var(--box-height-half)); }

    .gift-box__wrap .gift-box__side,
    .gift-box__wrap .gift-box__end,
    .gift-box-lid__wrap .gift-box-lid__side,
    .gift-box-lid__wrap .gift-box-lid__end {
      overflow: visible;
      border-color: transparent;
      background: none;
    }

    .gift-ribbon-band {
      position: absolute;
      display: block;
      background-color: #c39a50;
      clip-path: none;
      transition: clip-path 60ms linear;
      pointer-events: none;
      touch-action: none;
    }

    .gift-ribbon-band--horizontal {
      top: 42%;
      right: 0;
      left: 0;
      height: 16%;
      background-image: linear-gradient(180deg, #dfbd73, #b78b42 48%, #e1c276);
    }

    .gift-ribbon-band--vertical {
      top: 0;
      bottom: 0;
      left: 42%;
      width: 16%;
      background-image: linear-gradient(90deg, #b78b42, #e1c276 48%, #bb9048);
    }

    .gift-box__body .gift-box__side,
    .gift-box__body .gift-box__end,
    .gift-box-lid > .gift-box-lid__side,
    .gift-box-lid > .gift-box-lid__end {
      background-color: #102943;
      background-image: linear-gradient(145deg, #244665, #102943 78%);
    }

    .gift-box-lid {
      position: absolute;
      z-index: 4;
      top: calc(50% - var(--box-height-half) - 14px);
      left: 50%;
      width: var(--box-width);
      height: 28px;
      transform: translate(-50%, -50%);
      transform-origin: 50% 50% calc(0px - var(--box-depth-half));
      transform-style: preserve-3d;
    }

    .gift-box-lid__wrap {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .gift-box-lid__side--front,
    .gift-box-lid__side--back {
      width: var(--box-width);
      height: 28px;
    }

    .gift-box-lid__side--front { transform: translate(-50%, -50%) translateZ(calc(var(--box-depth-half) + 1px)); }
    .gift-box-lid__side--back { transform: translate(-50%, -50%) rotateY(180deg) translateZ(calc(var(--box-depth-half) + 1px)); }

    .gift-box-lid__side--left,
    .gift-box-lid__side--right {
      width: var(--box-depth);
      height: 28px;
    }

    .gift-box-lid__side--left { transform: translate(-50%, -50%) rotateY(-90deg) translateZ(calc(var(--box-width-half) + 1px)); }
    .gift-box-lid__side--right { transform: translate(-50%, -50%) rotateY(90deg) translateZ(calc(var(--box-width-half) + 1px)); }

    .gift-box-lid__end {
      width: var(--box-width);
      height: var(--box-depth);
    }

    .gift-box-lid__end--top { transform: translate(-50%, -50%) rotateX(90deg) translateZ(14px); }
    .gift-box-lid__end--bottom { transform: translate(-50%, -50%) rotateX(-90deg) translateZ(14px); }

    .gift-box__bow {
      position: absolute;
      z-index: 5;
      top: -34px;
      left: 50%;
      width: 76px;
      height: 40px;
      transform: translateX(-50%) translateZ(10px);
      transform-style: preserve-3d;
      cursor: pointer;
      touch-action: manipulation;
    }

    .gift-box__bow:focus-visible {
      outline: 2px solid #f2d58d;
      outline-offset: 4px;
    }

    .gift-box__bow-loop {
      position: absolute;
      top: 7px;
      width: 42px;
      height: 25px;
      border: 7px solid #d1ab64;
      border-radius: 55% 55% 45% 45%;
      box-shadow: inset 0 0 0 1px #f1d99a, 0 2px 4px #071b2b77;
    }

    .gift-box__bow-loop--left { left: 0; transform: rotate(28deg); }
    .gift-box__bow-loop--right { right: 0; transform: rotate(-28deg); }

    .gift-box__bow-knot {
      position: absolute;
      top: 14px;
      left: 31px;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: #e3c276;
    }

    .gift-box__glow {
      position: absolute;
      z-index: 1;
      top: 52%;
      left: 50%;
      width: 250px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(ellipse, #fff0b6, #edbb5480 37%, transparent 72%);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.3);
    }

    .gift-box-container.is-opening .gift-box-lid,
    .gift-box-container.is-opened .gift-box-lid {
      animation: gift-lid-open 850ms cubic-bezier(.2,.72,.2,1) forwards;
    }

    .gift-box-container.is-opening .gift-box__glow,
    .gift-box-container.is-opened .gift-box__glow {
      animation: gift-glow-open 850ms ease-out forwards;
    }

    .gift-box-container.is-unwrapped .gift-box__wrap,
    .gift-box-container.is-unwrapped .gift-box-lid__wrap { visibility: hidden; }

    .gift-box-container.is-unwrapped .gift-box__bow { visibility: hidden; }

    .gift-box-container.is-bow-dropping .gift-box__bow {
      animation: gift-bow-drop 620ms cubic-bezier(.25,.72,.3,1) forwards;
      pointer-events: none;
    }

    .gift-box-container.is-bow-dropped .gift-box__bow { visibility: hidden; }

    .gift-box-container.is-tearing .gift-box { transition: none; }

    .gift-box-container.is-opening .gift-box__end--top,
    .gift-box-container.is-opened .gift-box__end--top { opacity: .25; }

    .gift-box__end--top { transition: opacity 250ms ease; }

    .gift-box-container.is-falling { pointer-events: none; }
    .gift-box-container.is-landed { pointer-events: auto; }

    .gift-box-container.is-tear-bumping { animation: gift-box-tear-bump 430ms cubic-bezier(.2,.72,.25,1); }
    .gift-box-container.is-box-exiting { animation: gift-box-exit 650ms cubic-bezier(.4,0,.8,.4) forwards; }
    .gift-box-container.is-box-gone { visibility: hidden; }
    .gift-envelope {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: min(64vw, 250px);
      aspect-ratio: 1.55;
      visibility: hidden;
      opacity: 0;
      transform: translate(-50%, -50%) translateZ(12px) scale(.55) rotate(-8deg);
      transform-style: preserve-3d;
      perspective: 800px;
      pointer-events: none;
    }

    .gift-envelope.is-emerging {
      visibility: visible;
      opacity: 1;
      animation: envelope-pop-out 520ms cubic-bezier(.2,.75,.25,1) both;
    }

    .gift-envelope.is-lifted {
      position: fixed;
      z-index: 10;
      visibility: visible;
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .gift-envelope.is-flying-center {
      animation: envelope-center-flight 580ms cubic-bezier(.2,.75,.25,1) both;
    }

    .gift-envelope__scene {
      position: absolute;
      inset: 0;
      transform: rotateX(var(--envelope-rotate-x, -12deg)) rotateY(var(--envelope-rotate-y, -18deg));
      transform-style: preserve-3d;
    }

    .gift-envelope.is-rotatable {
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
    }

    .gift-envelope.is-rotating { cursor: grabbing; }

    .gift-envelope__back {
      position: absolute;
      inset: 0;
      border: 2px solid #a77e38;
      border-radius: 8px;
      background: linear-gradient(145deg, #fffdf7, #eee2c9);
      box-shadow: 0 15px 22px #10294330, inset 0 1px 4px #fff;
      transform: translateZ(-3px);
    }

    .gift-envelope__card {
      position: absolute;
      z-index: 1;
      top: 16%;
      left: calc(50% - min(25.42vw, 99px));
      width: min(50.84vw, 198px);
      height: min(28vw, 111px);
      border: 1px solid #d5bb83;
      border-radius: 4px;
      background: linear-gradient(#fffdf8, #f8f0df);
      box-shadow: 0 2px 5px #10294322;
      transform: translate3d(0, 0, 0);
    }

    .gift-envelope__card::before,
    .gift-envelope__card::after {
      position: absolute;
      right: 16%;
      left: 16%;
      height: 2px;
      border-radius: 2px;
      background: #d9c79f;
      content: "";
    }

    .gift-envelope__card::before { top: 28%; }
    .gift-envelope__card::after { top: 39%; right: 27%; }

    .gift-envelope__front {
      position: absolute;
      z-index: 2;
      inset: 0;
      border: 1px solid #b9924e;
      border-radius: 7px;
      background: linear-gradient(145deg, transparent 49.5%, #dfc98f 50%, #f6edda 51%), linear-gradient(35deg, #ead9b5 49%, #fff8e9 50%);
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
      transform: translateZ(5px);
    }

    .gift-envelope__flap {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 0;
      width: 100%;
      height: 64%;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(180deg, #fdf8ec, #dfc995);
      filter: drop-shadow(0 2px 2px #10294326);
      transform: rotateX(0deg) translateZ(8px);
      transform-origin: 50% 0;
      backface-visibility: hidden;
      transition: transform 650ms cubic-bezier(.2,.72,.25,1);
    }

    .gift-envelope__heart {
      position: absolute;
      z-index: 5;
      top: calc(58% - 2px);
      left: calc(50% + 3px);
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%) translateZ(12px);
      filter: drop-shadow(0 3px 3px #10294344);
    }

    .gift-envelope__heart svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gift-envelope__heart path {
      fill: #c9515c;
      stroke: #fff5e7;
      stroke-width: 1.8;
    }

    .gift-envelope.is-heart-dropping .gift-envelope__heart {
      animation: envelope-heart-drop 600ms cubic-bezier(.45,.05,.8,.5) forwards;
    }

    .gift-envelope.is-opening .gift-envelope__flap,
    .gift-envelope.is-open .gift-envelope__flap {
      transform: rotateX(178deg) translateZ(4px);
    }

    .gift-envelope.is-card-extracting .gift-envelope__card {
      animation: card-extraction 780ms cubic-bezier(.2,.75,.25,1) forwards;
    }

    .gift-envelope__card.is-card-flight {
      position: fixed;
      z-index: 10;
      margin: 0;
      transform: perspective(900px) rotateX(var(--card-rotate-x, 0deg)) rotateY(var(--card-rotate-y, 0deg));
      transition: top 800ms cubic-bezier(.2,.75,.25,1), left 800ms cubic-bezier(.2,.75,.25,1);
      will-change: top, left;
    }

    .gift-envelope__card.is-card-rotatable {
      cursor: grab;
      touch-action: none;
    }

    .gift-envelope__card.is-card-rotating { cursor: grabbing; }

    .gift-envelope__card.is-card-opening {
      box-shadow: 0 18px 30px #10294340;
      transition:
        left 900ms cubic-bezier(.2,.75,.25,1),
        top 900ms cubic-bezier(.2,.75,.25,1),
        width 900ms cubic-bezier(.2,.75,.25,1),
        height 900ms cubic-bezier(.2,.75,.25,1),
        border-radius 900ms ease,
        box-shadow 900ms ease;
    }

    .gift-envelope__card-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 300ms ease;
    }

    .gift-envelope__card.is-card-image-visible .gift-envelope__card-image { opacity: 1; }

    .gift-envelope__card.is-card-image-visible::before,
    .gift-envelope__card.is-card-image-visible::after { display: none; }

    @keyframes gift-box-tear-bump {
      0%, 100% { transform: translate3d(0, var(--fall-y, 0px), 0); }
      28% { transform: translate3d(0, calc(var(--fall-y, 0px) - 16px), 0); }
      54% { transform: translate3d(0, calc(var(--fall-y, 0px) + 4px), 0); }
      76% { transform: translate3d(0, calc(var(--fall-y, 0px) - 2px), 0); }
    }

    @keyframes gift-lid-open {
      to { transform: translate(-50%, -50%) rotateX(118deg) translateZ(-16px); }
    }

    @keyframes gift-glow-open {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
      70% { opacity: 1; transform: translate(-50%, -55%) scale(1.08); }
      100% { opacity: .92; transform: translate(-50%, -53%) scale(1); }
    }

    @keyframes gift-bow-drop {
      0% { transform: translateX(-50%) translateZ(10px) rotate(0); opacity: 1; }
      55% { transform: translate3d(-50%, 72px, 105px) rotate(18deg); opacity: 1; }
      100% { transform: translate3d(-50%, 190px, 175px) rotate(38deg); opacity: 0; }
    }

    @keyframes gift-box-exit {
      to { transform: translate3d(120vw, -20px, 0) rotate(22deg); opacity: 0; }
    }

    @keyframes envelope-pop-out {
      0% { opacity: 0; transform: translate(-50%, -50%) translateZ(12px) scale(.55) rotate(-8deg); }
      18% { opacity: 1; transform: translate(-50%, -50%) translateZ(16px) scale(.72) rotate(2deg); }
      58% { opacity: 1; transform: translate(-50%, calc(-50% - 110px)) translateZ(42px) scale(1.05) rotate(3deg); }
      100% { opacity: 1; transform: translate(-50%, calc(-50% - 120px)) translateZ(48px) scale(1) rotate(0); }
    }

    @keyframes envelope-center-flight {
      0% { transform: translate(-50%, -50%); }
      58% {
        transform: translate(calc(-50% + var(--flight-x)), calc(-50% + var(--flight-y) - 56px)) scale(1.05) rotate(3deg);
      }
      78% {
        transform: translate(calc(-50% + var(--flight-x)), calc(-50% + var(--flight-y) + 8px)) scale(.98) rotate(-1deg);
      }
      100% { transform: translate(calc(-50% + var(--flight-x)), calc(-50% + var(--flight-y))); }
    }

    @keyframes envelope-heart-drop {
      to { opacity: 0; transform: translate(-50%, 260%) translateZ(12px) rotate(28deg); }
    }

    @keyframes card-extraction {
      0% { z-index: 1; transform: translate3d(0, 0, 0); }
      48% { z-index: 1; transform: translate3d(0, -65%, 0); }
      49% { z-index: 6; transform: translate3d(0, -68%, 8px); }
      100% { z-index: 6; transform: translate3d(0, -135%, 45px) rotate(-3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gift-envelope__card.is-card-opening,
      .gift-envelope__card-image {
        transition-duration: 1ms;
        transition-delay: 0ms;
      }
    }
  </style>
</head>

          <div class="gift-box__end gift-box__end--top"><span class="gift-ribbon-band gift-ribbon-band--horizontal" data-ribbon="horizontal"></span><span class="gift-ribbon-band gift-ribbon-band--vertical" data-ribbon="vertical" data-ribbon-route="vertical" data-ribbon-segment="2"></span></div>

            <div class="gift-box-lid__side gift-box-lid__side--right"><span class="gift-ribbon-band gift-ribbon-band--vertical" data-ribbon="vertical" data-ribbon-route="connector" data-ribbon-segment="1"></span></div>
