<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <title>生日卡片</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      background: #f5f0e6;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="assets/card.png" alt="生日卡片">
</body>
</html>
